name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: cursor-share-image-mirror-0.0.1.vsix
          body: |
            在 Cursor 中执行 Extensions: Install from VSIX，选择 cursor-share-image-mirror-0.0.1.vsix。
